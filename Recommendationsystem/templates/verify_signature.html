{% load static %}
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="EN" lang="EN" dir="ltr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <meta http-equiv="imagetoolbar" content="no" />
    <title>Signature Verification System</title>

    <!-- External Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" type="text/css" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- External Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <!-- Static Scripts -->
    <script src="{% static 'js/jquery.defaultvalue.js' %}"></script>
    <script src="{% static 'js/jquery.cycle.lite.min.js' %}"></script>

    <!-- Custom Styles -->
    <style>
        body{
            background-color:black;
        }
        .carousel-item {
            height: 500px;
        }
        .carousel-item img {
            object-fit: cover;
            height: 100%;
            width: 100%;
        }
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
        }
        .carousel-caption h5 {
            color: #ffffff;
            font-size: 24px;
            text-align: center;
        }
        .last a {
            display: inline-block;
            padding: 15px 30px;
            background-color: #7EBC12;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }
        .last a:hover {
            background-color: darkgreen;
        }
        .display-4 {
            font-size: 2.25rem;
            font-weight: bold;
            color: #333;
            opacity: 0;
            transform: translateX(-100%);
            animation: slideInLeftAnimation 0.5s ease forwards;
        }
        @keyframes slideInLeftAnimation {
            0% {
                opacity: 0;
                transform: translateX(-100%);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

    <!-- Initialize Carousel -->
    <script>
        $(document).ready(function () {
            $("#header-carousel-new").carousel();
            $("#header-carousel-original").carousel();
        });
        document.addEventListener("DOMContentLoaded", function () {
            setInterval(function () {
                $("#header-carousel-new").carousel('next');
                $("#header-carousel-original").carousel('next');
            }, 1000);
        });
    </script>
</head>

<body>
<!-- Start Page Source -->
<div class="wrapper col1">
    <div id="header" class="clear">
        <div class="fl_left">
            <h1>
                <a href="#">
                    <h1 class="display-4 animated slideInLeft" style="font-size:40px;">
                        <center>Signature Verify</center>
                    </h1>
                </a>
            </h1>
        </div>
        <div class="fl_right">
            <ul style="text-transform: uppercase;">
                <li class="active"><a href="user_dashboard"><span>Home</span></a></li>
                <li><a href="upload_signature"><span>Upload Signature</span></a></li>
                <li><a href="verify_signature"><span>Verify Signature</span></a></li>
                <li class="last"><a href="user_logout"><span>Logout</span></a></li>
            </ul>
        </div>
    </div>
</div>

<!-- Main Content Area -->
<!-- Content Area -->
<h1 style="text-align: center; font-family: 'Arial', sans-serif; color:rgb(29, 238, 36); margin-bottom: 30px; font-size: 36px; font-weight: bold;margin-top:50px;">Verify Signature</h1>

<form method="POST" enctype="multipart/form-data" action="verify_signature" style="max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; background-color: #f9f9f9; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
    {% csrf_token %}
    <label for="signature_image" style="font-size: 18px; font-weight: bold; display: block; margin-bottom: 10px;">Upload Signature Image:</label>
    <input type="file" id="signature_image" name="signature_image" accept="image/*" required style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px;">
    <br><br>

    <button type="submit" style="width: 100%; padding: 12px; font-size: 18px; background-color:rgb(54, 218, 59); color: white; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s;">
        Verify
    </button>
</form>

{% if result %}
    <h2 style="text-align: center; font-size: 24px; color: #d32f2f; margin-top: 30px; font-family: 'Arial', sans-serif;">{{ result }}</h2>
{% endif %}



<!-- Footer -->

<!-- End Page Source -->
</body>
</html>
