{% load static %}
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="EN" lang="EN" dir="ltr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <meta http-equiv="imagetoolbar" content="no" />
    <title>Signature Verification System</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" type="text/css" />
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Conditional Styles for IE -->
    <!--[if lte IE 8]><style type="text/css">@import url('styles/ie.css');</style><![endif]-->

    <!-- Scripts -->
    <script type="text/javascript" src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script type="text/javascript" src="{% static 'js/jquery.defaultvalue.js' %}"></script>

    <style>
        body {
            background-color: black;
        }

        .login-container {
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            margin-top: 100px;
            background: linear-gradient(135deg, white, #7EBC12, #C8C8C8, grey, #7EBC12);
            background-size: 600% 600%;
            animation: gradientAnimation 15s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-form h1 {
            text-align: center;
            margin-bottom: 20px;
            color: black;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: white;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 103%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color:rgb(120, 16, 218);
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-container:hover {
            background-color: #7EBC12;
        }

        #image-col {
            animation: slideInLeft 1s ease forwards;
        }

        #form-col {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .last a {
            display: inline-block;
            padding: 15px 30px;
            background-color: #7EBC12;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .last a:hover {
            background-color: darkgreen;
        }
    </style>

    <script type="text/javascript">
        jQuery(function ($) {
            $("#name, #email, #message").defaultvalue("Name", "Email", "Message");
        });

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("form-col").style.display = "block";
        });
    </script>
</head>

<body>
    <!-- Header Section -->
    <div class="wrapper col1">
        <div id="header" class="clear">
            <div class="fl_left">
                <h1><a href="#">Signature Verification</a></h1>
            </div>
            <div class="fl_right">
                <ul style="text-transform: uppercase;">
                    <li class="active"><a href="index"><span>Home</span></a></li>
                    <li><a href="about"><span>About</span></a></li>
                    <li><a href="user_registration"><span>Register</span></a></li>
                    <li><a href="user_login"><span>Login</span></a></li>
                    <li class="last"><a href="admin_login"><span>Admin Login</span></a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Page Heading -->
    <div class="wrapper col2">
        <div id="topbar">
            <div id="crumb">
                <center><h2 style="font-size:50px;">Register Here!!!!</h2></center>
            </div>
        </div>
    </div>

    <!-- Main Content Section -->
    <div class="container" id="container">
        <div class="row">
            <!-- Image Section -->
            <div class="col-md-6" id="image-col">
                <img src="{% static 'images/img1.gif' %}" alt="Image" class="img-fluid" style="margin-top:120px; height:450px; width:500px;">
            </div>

            <!-- Form Section -->
            <div class="col-md-6" id="form-col" style="display: none;">
                <div class="login-container">
                    <form class="login-form" action="submit_user_registration_details" method="post">
                        <h1 style="color:white;"></h1>
                        <div class="input-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Name" required>
                        </div>
                        <div class="input-group">
                            <label for="contact">Contact</label>
                            <input type="text" id="contact" name="contact" placeholder="Contact" required>
                        </div>
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="input-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Password" required>
                        </div>
                        <button type="submit">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    

    <!-- Include Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
